<?xml version="1.0" encoding="UTF-8"?>
<!-- Folderstamp logo: editable vector redraw of the supplied logo artwork. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="1024" viewBox="0 0 1536 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Folderstamp</title>
  <desc id="desc">A purple folder inside a white postage stamp, followed by the Folderstamp wordmark.</desc>

  <defs>
    <linearGradient id="folderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6a2ff"/>
      <stop offset="1" stop-color="#7938e8"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a879ff"/>
      <stop offset="1" stop-color="#8b42ed"/>
    </linearGradient>
    <mask id="stampCutouts">
      <rect x="0" y="0" width="460" height="460" fill="white"/>
      <!-- Repeated circular bites create the perforated postage-stamp edge. -->
      <g fill="black">
        <circle cx="76" cy="28" r="17"/><circle cx="154" cy="28" r="17"/>
        <circle cx="232" cy="28" r="17"/><circle cx="310" cy="28" r="17"/>
        <circle cx="388" cy="28" r="17"/>
        <circle cx="76" cy="432" r="17"/><circle cx="154" cy="432" r="17"/>
        <circle cx="232" cy="432" r="17"/><circle cx="310" cy="432" r="17"/>
        <circle cx="388" cy="432" r="17"/>
        <circle cx="28" cy="96" r="17"/><circle cx="28" cy="174" r="17"/>
        <circle cx="28" cy="252" r="17"/><circle cx="28" cy="330" r="17"/>
        <circle cx="432" cy="96" r="17"/><circle cx="432" cy="174" r="17"/>
        <circle cx="432" cy="252" r="17"/><circle cx="432" cy="330" r="17"/>
      </g>
    </mask>
  </defs>

  <!-- Deep-navy canvas used by the supplied primary artwork. -->
  <rect width="1536" height="1024" fill="#0b1326"/>

  <!-- Postage stamp and folder mark. -->
  <g transform="translate(82 280) rotate(-9 230 230)">
    <rect x="20" y="20" width="420" height="420" rx="32"
          fill="#f8f7ff" mask="url(#stampCutouts)"/>
    <rect x="72" y="72" width="316" height="316" rx="25"
          fill="#0b1326"/>

    <!-- Rear folder sheet. -->
    <path d="M116 170 Q116 137 149 137 H226 Q244 137 257 154 L273 173 H340
             Q371 173 371 204 V298 Q371 329 340 329 H147 Q116 329 116 298 Z"
          fill="#bd9aff"/>
    <!-- Front folder sheet. -->
    <path d="M116 207 Q116 178 145 178 H226 Q244 178 258 195 L273 212 H340
             Q371 212 371 243 V318 Q371 347 342 347 H145 Q116 347 116 318 Z"
          fill="url(#folderGradient)"/>

    <!-- Three flowing archive / transfer lines. -->
    <g fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round">
      <path d="M270 244 C308 211 328 209 367 224 C386 231 399 224 420 205"/>
      <path d="M276 278 C315 245 336 244 374 259 C393 266 406 259 427 240"/>
      <path d="M282 312 C321 279 342 278 380 293 C399 300 412 293 433 274"/>
    </g>
  </g>

  <!-- Wordmark. System font fallbacks keep the SVG self-contained. -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
     font-size="132" font-weight="800" letter-spacing="-5">
    <text x="552" y="586" fill="#fbfaff">Folder</text>
    <text x="982" y="586" fill="url(#wordGradient)">stamp</text>
  </g>
</svg>